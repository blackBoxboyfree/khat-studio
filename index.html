<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استوديو الخط العربي</title>
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#1d1b18;--mute:#7a746b;--line:#e3dfd8;--acc:#1f6f5c;--acc2:#e8f3ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.wrap{max-width:1200px;margin:0 auto;padding:0 12px}
h1{margin:0;padding:16px 14px 4px;font-size:21px}
.sub{padding:0 14px 10px;color:var(--mute);font-size:14px;margin:0}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0 14px}
.box label{display:block;font-weight:700;margin-bottom:8px;font-size:15px}
.box label span{display:inline-block;background:var(--ink);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:13px;margin-inline-end:6px}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:20px;font-family:inherit;resize:none;color:var(--ink);background:#fcfbf9}
.cnt{font-size:12px;color:var(--mute);text-align:left;margin-top:4px}
.tools{display:flex;gap:8px}
.tools input{flex:1;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:15px;font-family:inherit;background:#fcfbf9}
.tools button{height:40px;padding:0 16px;border-radius:10px;border:0;background:var(--ink);color:#fff;font-family:inherit;font-size:14px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0 2px}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:13px;font-family:inherit;color:var(--mute);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
main{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
@media(min-width:620px){main{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){main{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1150px){main{grid-template-columns:repeat(5,1fr)}}
.card{background:var(--card);border:3px solid transparent;border-radius:16px;overflow:hidden;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.card.flash{animation:fl 1.4s}
@keyframes fl{0%,60%{box-shadow:0 0 0 6px #f3b53f}100%{}}
.card img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:#fafafa}
.foot{display:flex;align-items:center;justify-content:space-between;padding:6px 10px}
.num{font-size:18px;font-weight:800}
.zoom{width:34px;height:34px;border-radius:10px;border:0;background:var(--acc2);color:var(--acc);font-size:16px;cursor:pointer}
.tick{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:var(--acc);display:none;align-items:center;justify-content:center}
.card.sel .tick{display:flex}
.tick svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:3}
.tag{position:absolute;top:8px;right:8px;background:#f3b53f;color:#3a2a00;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700}
.tag.m{background:var(--acc);color:#fff}
.bar{position:fixed;inset-inline:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
.bar .info{flex:1;font-size:14px;color:var(--mute);line-height:1.4}
.bar .info b{color:var(--ink);font-size:15px}
.pay{height:48px;padding:0 20px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-weight:700;font-size:16px;font-family:inherit;cursor:pointer}
.pay:disabled{background:#b7b2a8;cursor:not-allowed}
.lb{position:fixed;inset:0;z-index:50;background:rgba(15,14,12,.92);display:none;flex-direction:column}
.lb.open{display:flex}
.lb .top{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:12px 16px}
.lb .top b{font-size:20px}
.lb .x{background:none;border:0;color:#fff;font-size:30px;cursor:pointer}
.lb .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 8px}
.lb img{max-width:100%;max-height:100%;border-radius:14px;background:#fff}
.lb .acts{display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));justify-content:center}
.lb .acts button{height:46px;padding:0 24px;border-radius:12px;border:0;font-size:16px;font-family:inherit;cursor:pointer;background:var(--acc);color:#fff;font-weight:700}
.res{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;overflow:auto}
.res.open{display:block}
.res .in{max-width:560px;margin:0 auto;padding:24px 16px;text-align:center}
.res img{width:100%;border-radius:18px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.res h2{margin:0 0 10px;font-size:20px}
.res p{color:var(--mute);line-height:1.7}
.res .b{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 24px;border-radius:12px;border:0;font-size:16px;font-family:inherit;cursor:pointer;margin:6px;text-decoration:none}
.res .b.p{background:var(--acc);color:#fff;font-weight:700}
.res .b.s{background:#fff;color:var(--ink);border:1px solid var(--line)}
.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:40px auto 16px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1d1b18;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>استوديو الخط العربي</h1>
  <p class="sub">اكتب نصك، اختر النمط الذي يعجبك، وسيُصمَّم لك بالذكاء الاصطناعي.</p>

  <div class="box">
    <label for="txt"><span>1</span>اكتب النص المراد تصميمه</label>
    <textarea id="txt" maxlength="60" placeholder="مثال: عبدالله، أو: كل عام وأنتم بخير"></textarea>
    <div class="cnt"><span id="len">0</span> / 60</div>
  </div>

  <div class="box" style="margin-bottom:0">
    <label><span>2</span>اختر التصميم (اضغط على البطاقة)</label>
    <div class="tools"><input id="go" inputmode="numeric" placeholder="أو اكتب رقم التصميم"><button id="goBtn">اذهب</button></div>
    <div class="chips" id="chips"></div>
  </div>
  <main id="grid"></main>
</div>

<div class="bar">
  <div class="info" id="info"></div>
  <button class="pay" id="pay" disabled>ادفع وصمّم</button>
</div>

<div class="lb" id="lb">
  <div class="top"><b id="lbNum"></b><button class="x" id="lbX">×</button></div>
  <div class="stage"><img id="lbImg" alt=""></div>
  <div class="acts"><button id="lbPick">اختيار هذا التصميم</button></div>
</div>

<div class="res" id="res"><div class="in" id="resIn"></div></div>
<div class="toast" id="toast"></div>

<script>
const D=[{"n":1,"f":"img/001.jpg","k":"full"},{"n":2,"f":"img/002.jpg","k":"full"},{"n":3,"f":"img/003.jpg","k":"full"},{"n":4,"f":"img/004.jpg","k":"full"},{"n":5,"f":"img/005.jpg","k":"full"},{"n":6,"f":"img/006.jpg","k":"full"},{"n":7,"f":"img/007.jpg","k":"full"},{"n":8,"f":"img/008.jpg","k":"full"},{"n":9,"f":"img/009.jpg","k":"full"},{"n":10,"f":"img/010.jpg","k":"full"},{"n":11,"f":"img/011.jpg","k":"full"},{"n":12,"f":"img/012.jpg","k":"full"},{"n":13,"f":"img/013.jpg","k":"full"},{"n":14,"f":"img/014.jpg","k":"full"},{"n":15,"f":"img/015.jpg","k":"full"},{"n":16,"f":"img/016.jpg","k":"full"},{"n":17,"f":"img/017.jpg","k":"full"},{"n":18,"f":"img/018.jpg","k":"full"},{"n":19,"f":"img/019.jpg","k":"full"},{"n":20,"f":"img/020.jpg","k":"full"},{"n":21,"f":"img/021.jpg","k":"full"},{"n":22,"f":"img/022.jpg","k":"full"},{"n":23,"f":"img/023.jpg","k":"full"},{"n":24,"f":"img/024.jpg","k":"full"},{"n":25,"f":"img/025.jpg","k":"full"},{"n":26,"f":"img/026.jpg","k":"full"},{"n":27,"f":"img/027.jpg","k":"full"},{"n":28,"f":"img/028.jpg","k":"full"},{"n":29,"f":"img/029.jpg","k":"full"},{"n":30,"f":"img/030.jpg","k":"full"},{"n":31,"f":"img/031.jpg","k":"full"},{"n":32,"f":"img/032.jpg","k":"full"},{"n":33,"f":"img/033.jpg","k":"full"},{"n":34,"f":"img/034.jpg","k":"full"},{"n":35,"f":"img/035.jpg","k":"full"},{"n":36,"f":"img/036.jpg","k":"full"},{"n":37,"f":"img/037.jpg","k":"full"},{"n":38,"f":"img/038.jpg","k":"full"},{"n":39,"f":"img/039.jpg","k":"full"},{"n":40,"f":"img/040.jpg","k":"full"},{"n":41,"f":"img/041.jpg","k":"full"},{"n":42,"f":"img/042.jpg","k":"full"},{"n":43,"f":"img/043.jpg","k":"full"},{"n":44,"f":"img/044.jpg","k":"full"},{"n":45,"f":"img/045.jpg","k":"full"},{"n":46,"f":"img/046.jpg","k":"full"},{"n":47,"f":"img/047.jpg","k":"full"},{"n":48,"f":"img/048.jpg","k":"full"},{"n":49,"f":"img/049.jpg","k":"full"},{"n":50,"f":"img/050.jpg","k":"full"},{"n":51,"f":"img/051.jpg","k":"full"},{"n":52,"f":"img/052.jpg","k":"full"},{"n":53,"f":"img/053.jpg","k":"full"},{"n":54,"f":"img/054.jpg","k":"full"},{"n":55,"f":"img/055.jpg","k":"full"},{"n":56,"f":"img/056.jpg","k":"full"},{"n":57,"f":"img/057.jpg","k":"full"},{"n":58,"f":"img/058.jpg","k":"full"},{"n":59,"f":"img/059.jpg","k":"full"},{"n":60,"f":"img/060.jpg","k":"full"},{"n":61,"f":"img/061.jpg","k":"full"},{"n":62,"f":"img/062.jpg","k":"full"},{"n":63,"f":"img/063.jpg","k":"full"},{"n":64,"f":"img/064.jpg","k":"full"},{"n":65,"f":"img/065.jpg","k":"full"},{"n":66,"f":"img/066.jpg","k":"full"},{"n":67,"f":"img/067.jpg","k":"full"},{"n":68,"f":"img/068.jpg","k":"full"},{"n":69,"f":"img/069.jpg","k":"full"},{"n":70,"f":"img/070.jpg","k":"full"},{"n":71,"f":"img/071.jpg","k":"full"},{"n":72,"f":"img/072.jpg","k":"full"},{"n":73,"f":"img/073.jpg","k":"partial"},{"n":74,"f":"img/074.jpg","k":"partial"},{"n":75,"f":"img/075.jpg","k":"partial"},{"n":76,"f":"img/076.jpg","k":"partial"},{"n":77,"f":"img/077.jpg","k":"partial"},{"n":78,"f":"img/078.jpg","k":"partial"},{"n":79,"f":"img/079.jpg","k":"partial"},{"n":80,"f":"img/080.jpg","k":"partial"},{"n":81,"f":"img/081.jpg","k":"partial"},{"n":82,"f":"img/082.jpg","k":"partial"},{"n":83,"f":"img/083.jpg","k":"partial"},{"n":84,"f":"img/084.jpg","k":"partial"},{"n":85,"f":"img/085.jpg","k":"partial"},{"n":86,"f":"img/086.jpg","k":"partial"},{"n":87,"f":"img/087.jpg","k":"mine"},{"n":88,"f":"img/088.jpg","k":"mine"}];
const KIND={partial:"مقصوص",mine:"تصميمي"};
const $=id=>document.getElementById(id);
const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),3000)};
let pick=null,filter="all",cfg={amount:100,currency:"usd",ready:true};
const money=()=>{try{return new Intl.NumberFormat("ar",{style:"currency",currency:cfg.currency.toUpperCase()}).format(cfg.amount/100)}catch(e){return (cfg.amount/100)+" "+cfg.currency.toUpperCase()}};
const tick='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

fetch("/api/config").then(r=>r.json()).then(c=>{cfg=c;upd()}).catch(()=>{});

function chips(){
  const c=[["all","الكل ("+D.length+")"],["full","كاملة"],["partial","مقصوصة"],["mine","تصاميمي"]];
  $("chips").innerHTML=c.map(([k,t])=>`<button class="chip ${filter==k?"on":""}" data-k="${k}">${t}</button>`).join("");
}
function render(){
  chips();
  const v=D.filter(x=>filter=="all"||x.k==filter);
  $("grid").innerHTML=v.map(x=>`<div class="card ${pick==x.n?"sel":""}" id="c${x.n}" data-n="${x.n}">
    <img loading="lazy" src="${x.f}" alt="تصميم ${x.n}">
    <span class="tick">${tick}</span>
    ${x.k!="full"?`<span class="tag ${x.k=="mine"?"m":""}">${KIND[x.k]}</span>`:""}
    <div class="foot"><span class="num">${x.n}</span><button class="zoom" data-z="${x.n}" aria-label="تكبير">⤢</button></div>
  </div>`).join("");
}
function upd(){
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("sel",+c.dataset.n==pick));
  const t=$("txt").value.trim();
  $("len").textContent=$("txt").value.length;
  const ok=t&&pick&&cfg.ready;
  $("pay").disabled=!ok;
  $("pay").textContent="ادفع "+money()+" وصمّم";
  $("info").innerHTML=!cfg.ready?"<b>الخدمة غير مفعّلة بعد</b>":(!t?"اكتب النص أولاً":(!pick?"<b>اختر تصميماً</b>":`<b>التصميم رقم ${pick}</b> · «${t.length>18?t.slice(0,18)+"…":t}»`));
  if($("lb").classList.contains("open"))lbUpd();
}
$("txt").oninput=upd;
$("chips").onclick=e=>{const k=e.target.dataset.k;if(k){filter=k;render()}};
$("grid").onclick=e=>{
  const z=e.target.closest("[data-z]");if(z){openLb(+z.dataset.z);return}
  const c=e.target.closest(".card");if(c){pick=+c.dataset.n;upd()}
};
function go(){
  const n=parseInt($("go").value.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)),10);
  if(!D.some(x=>x.n==n)){toast("رقم غير موجود");return}
  if(filter!="all"){filter="all";render()}
  pick=n;upd();
  const el=$("c"+n);el.scrollIntoView({block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");
  $("go").value="";
}
$("goBtn").onclick=go;$("go").onkeydown=e=>{if(e.key=="Enter")go()};

let cur=0;
function openLb(n){cur=n;$("lb").classList.add("open");lbUpd();document.body.style.overflow="hidden"}
function lbUpd(){const x=D.find(d=>d.n==cur);$("lbImg").src=x.f;$("lbNum").textContent="تصميم رقم "+x.n;$("lbPick").textContent=pick==cur?"✓ مختار":"اختيار هذا التصميم"}
function closeLb(){$("lb").classList.remove("open");document.body.style.overflow=""}
$("lbX").onclick=closeLb;
$("lbPick").onclick=()=>{pick=cur;upd();closeLb()};

$("pay").onclick=async()=>{
  const btn=$("pay");btn.disabled=true;btn.textContent="جارٍ التحويل للدفع…";
  try{
    const r=await fetch("/api/checkout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({design:pick,text:$("txt").value.trim()})});
    const j=await r.json();
    if(!r.ok||!j.url)throw new Error(j.error||"error");
    location.href=j.url;
  }catch(e){toast(e.message=="not_configured"?"الدفع غير مفعّل بعد":"تعذّر بدء الدفع، حاول مرة أخرى");upd()}
};

/* result view after payment */
const ERR={already_used:"تم توليد هذا الطلب سابقاً ولا يمكن إعادته.",busy:"الطلب قيد التنفيذ، انتظر قليلاً ثم أعد المحاولة.",not_paid:"لم يكتمل الدفع.",not_configured:"الخدمة غير مفعّلة بعد."};
function showRes(html){$("resIn").innerHTML=html;$("res").classList.add("open");document.body.style.overflow="hidden"}
async function runGenerate(sid){
  showRes('<div class="spin"></div><h2>جارٍ تصميم نصك…</h2><p>تم الدفع بنجاح. قد يستغرق التوليد نحو نصف دقيقة، لا تغلق الصفحة.</p>');
  try{
    const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sid})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||"error");
    const src="data:"+j.mime+";base64,"+j.data;
    const ext=j.mime.includes("jpeg")?"jpg":"png";
    showRes(`<h2>تم التصميم ✓</h2><img src="${src}" alt="التصميم"><p style="margin:14px 0 4px">احفظ التصميم الآن، لا يمكن توليده مرة أخرى بنفس الدفع.</p>
      <a class="b p" href="${src}" download="design-${j.design}-${Date.now()}.${ext}">تنزيل الصورة</a>
      <button class="b s" onclick="location.href='/'">تصميم جديد</button>`);
  }catch(e){
    const m=ERR[e.message]||"تعذّر توليد التصميم. لم يُستهلك دفعك، أعد المحاولة.";
    const retry=(e.message=="already_used"||e.message=="not_paid")?"":`<button class="b p" id="retry">إعادة المحاولة</button>`;
    showRes(`<h2>لم يكتمل التصميم</h2><p>${m}</p>${retry}<button class="b s" onclick="location.href='/'">الرئيسية</button>`);
    const rb=document.getElementById("retry");if(rb)rb.onclick=()=>runGenerate(sid);
  }
}
const qs=new URLSearchParams(location.search);
if(qs.get("session_id"))runGenerate(qs.get("session_id"));
else if(qs.get("canceled"))toast("تم إلغاء الدفع");
render();upd();
</script>
</body>
</html>
